<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Mumble It{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Alata&family=Alex+Brush&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-title">Mumble It</span>
    <span class="brand-tagline">chante, on devine</span>
  </a>
  <nav class="topnav">
    <a href="/">Enregistrer</a>
    <a href="/library">Bibliothèque</a>
  </nav>
  <div id="pseudo-bar" class="pseudo-bar"></div>
</header>
<main class="page">
  {% block content %}{% endblock %}
</main>
<div id="toast" class="toast" hidden></div>
<script type="module" src="/static/js/app.js"></script>
</body>
</html>
